<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <meta
        name="theme-color"
        content="#123b2a"
    >

    <title>
        Page Not Found | Habarana Lake Breeze Cabana
    </title>

    <link
        rel="icon"
        href="favicon.png"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .error-page {
            min-height: 100svh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 100px 20px;

            background:
                linear-gradient(
                    135deg,
                    #f7f4ec,
                    #eee8db
                );
        }

        .error-content {
            max-width: 650px;
        }

        .error-number {
            margin-bottom: 5px;

            color: #b99a55;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size:
                clamp(6rem, 18vw, 12rem);

            font-weight: 500;

            line-height: .8;

            letter-spacing: -.08em;
        }

        .error-content h1 {
            font-size:
                clamp(2.5rem, 5vw, 4rem);
        }

        .error-content p:not(.eyebrow) {
            max-width: 520px;

            margin:
                20px auto 0;

            color: #69746d;
        }

        .error-actions {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-top: 35px;
        }

    </style>

</head>


<body>


<main class="error-page">

    <div class="error-content">

        <p class="error-number">
            404
        </p>

        <p class="eyebrow">
            Wrong turn
        </p>

        <h1>
            This page
            <span>wandered away.</span>
        </h1>

        <p>
            The page you're looking for doesn't exist
            or may have moved. Let's get you back to
            Habarana.
        </p>


        <div class="error-actions">

            <a
                href="index.html"
                class="btn btn-primary"
            >
                Back to home
            </a>

            <a
                href="rooms.html"
                class="btn btn-outline-dark"
            >
                View accommodation
            </a>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

</body>

  </html>
